sentence=ADS1015 analog sensing and PCF8574 I/O library for APA pool automation.
paragraph=Reads pressure, AC current (RMS), solar irradiance (LDR), and AUX voltage via ADS1015 ADC. Manages tank-empty sensors and status LEDs via PCF8574AT I/O expander, plus an active or passive buzzer with alert and Morse patterns. Requires only Wire.h — no external dependencies.
